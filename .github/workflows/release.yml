name: Private test packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: Prepare unpublished test download
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: draft
        name: Create an unpublished draft only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="private-test-${GITHUB_RUN_ID}"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --title "Private test ${GITHUB_SHA:0:8}" --notes "Unpublished test installers for repository maintainers. Source commit: $GITHUB_SHA. Do not publish this draft."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    permissions:
      contents: write
    name: Package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-14
            target: x86_64-apple-darwin
            bundles: dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          # The runner's Azure HTTP mirror can stall large WebKit downloads.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::ForceIPv4=true update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::ForceIPv4=true install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build beta installers
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          WUJIAN_BUILD_COMMIT: ${{ github.sha }}
      - name: Collect packages and SHA-256
        shell: python
        run: |
          import hashlib, json, pathlib, shutil
          root = pathlib.Path('src-tauri/target/${{ matrix.target }}/release/bundle')
          out = pathlib.Path('beta-packages')
          out.mkdir()
          packages = [p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.dmg', '.exe', '.deb', '.appimage'}]
          if not packages:
              raise SystemExit('No packages produced')
          version = json.loads(pathlib.Path('package.json').read_text(encoding='utf-8'))['version']
          (out / 'build-${{ matrix.target }}.json').write_text(json.dumps({'version': version, 'commit': '${{ github.sha }}', 'target': '${{ matrix.target }}'}, indent=2) + '\n', encoding='utf-8')
          for p in packages:
              suffix = '-setup.exe' if p.suffix.lower() == '.exe' else p.suffix
              name = 'wujian-' + version + '-${{ matrix.target }}' + suffix
              target = out / name
              if target.exists():
                  raise SystemExit('Duplicate package name: ' + name)
              shutil.copy2(p, target)
              (out / (name + '.sha256')).write_bytes((hashlib.sha256(target.read_bytes()).hexdigest() + '  ' + name + '\n').encode('utf-8'))
      - name: Upload installers to the unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ needs.draft.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$DRAFT_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$DRAFT_TAG" beta-packages/* --clobber
          echo "Installers uploaded to an unpublished draft; no Actions download artifact was created." >> "$GITHUB_STEP_SUMMARY"
